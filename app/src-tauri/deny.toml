# cargo-deny: known vulnerabilities, licences, and where crates come from.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates deep in Tauri's tree are reported but don't fail the build.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Some of these are only used by optional or future dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
