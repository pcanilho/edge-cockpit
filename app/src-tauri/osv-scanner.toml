# Advisories in Cargo.lock that don't reach the app. Edge Cockpit only ships for
# Windows; these crates come in through Tauri's Linux backend (GTK, D-Bus) or as
# build-time tooling, and none of them is compiled into the Windows build
# (`cargo tree --target x86_64-pc-windows-msvc -i <crate>` prints nothing).
# cargo-deny checks the Windows target and flags anything that does reach it.

[[IgnoredVulns]]
