[package]
name = "edge-cockpit"
version = "0.6.0"
description = "A lightweight cockpit-style touch console for Star Citizen"
authors = ["pcanilho"]
license = "MIT"
repository = "https://github.com/pcanilho/edge-cockpit"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "edge-cockpit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Controls",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Devices_Display",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
