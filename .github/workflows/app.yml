name: App

# Builds the Windows app on every pull request and on main. Run it by hand from the
# Actions tab with "release" ticked to publish v<version> (from app/src-tauri/tauri.conf.json),
# with notes from CHANGELOG.md, SHA-256 checksums, the self-update manifest and, when a
# VirusTotal key is set, a scan of each exe.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (v<version> from app/src-tauri/tauri.conf.json)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # Signs the self-update files (not the exe). Without it the app still builds, but
      # the release carries no update manifest.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Sync shared layout, icons and Game.log reader
        run: node scripts/sync.mjs
      - name: UI scripts parse
        run: for f in ui/*.js ui/lib/*.js; do node --check "$f"; done
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Build the installer
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: building without self-update files."
            npx tauri build
          fi
      - name: Collect
        id: out
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p ../out
          setup="Edge-Cockpit-$version-setup.exe"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "../out/$setup"
          cp src-tauri/target/release/edge-cockpit.exe "../out/Edge-Cockpit-$version-portable.exe"
          sig=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -1 || true)
          [ -n "$sig" ] && cp "$sig" "../out/$setup.sig"
          (cd ../out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: edge-cockpit
          path: |
            out/*.exe
            out/SHA256SUMS.txt
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VERSION: ${{ steps.out.outputs.version }}
        run: |
          tag="v$VERSION"
          setup="Edge-Cockpit-$VERSION-setup.exe"
          # What's new: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '$0 ~ "^## " { on = ($2 == v); next } on' ../CHANGELOG.md | sed '/./,$!d' > ../out/notes.md
          [ -s ../out/notes.md ] || echo "Edge Cockpit $VERSION." > ../out/notes.md
          game=$(node -p "require('../layouts/ships.json').gameVersion.split('.').slice(0, 3).join('.')")
          {
            cat ../out/notes.md
            echo
            echo "Tested on Star Citizen $game. Run the setup, or the portable exe without installing."
            echo "Windows SmartScreen warns because the exe is not code signed: click **More info**, then **Run anyway**."
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat ../out/SHA256SUMS.txt
            echo '```'
          } > ../out/release.md
          if [ -n "$VT_API_KEY" ]; then
            echo >> ../out/release.md
            echo "### VirusTotal" >> ../out/release.md
            for f in ../out/*.exe; do
              curl -sf --request POST https://www.virustotal.com/api/v3/files -H "x-apikey: $VT_API_KEY" --form file=@"$f" >/dev/null \
                && echo "- [$(basename "$f")](https://www.virustotal.com/gui/file/$(sha256sum "$f" | cut -d' ' -f1))" >> ../out/release.md \
                || echo "::warning::VirusTotal upload failed for $f"
            done
          fi
          assets=(../out/*.exe ../out/SHA256SUMS.txt)
          if [ -f "../out/$setup.sig" ]; then
            node -e '
              const fs = require("fs"), [v, setup, repo] = process.argv.slice(1);
              fs.writeFileSync("../out/latest.json", JSON.stringify({
                version: v, notes: fs.readFileSync("../out/notes.md", "utf8").trim(), pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": { signature: fs.readFileSync(`../out/${setup}.sig`, "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/v${v}/${setup}` } },
              }, null, 2));' "$VERSION" "$setup" "$GITHUB_REPOSITORY"
            assets+=(../out/latest.json)
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Edge Cockpit $VERSION" --notes-file ../out/release.md "${assets[@]}" \
          || { gh release edit "$tag" --notes-file ../out/release.md && gh release upload "$tag" --clobber "${assets[@]}"; }
