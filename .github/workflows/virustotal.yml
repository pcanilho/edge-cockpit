name: VirusTotal

# Scans the exes of a release that is already published, puts the results in its
# notes and updates the README badge. New releases are scanned by app.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.0
        required: true

permissions: {}

concurrency:
  group: virustotal-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # put the results in the release notes and the README badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan, link and update the badge
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$VT_API_KEY" ] || { echo "::error::VT_API_KEY is not set"; exit 1; }
          mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir out
          .github/scripts/virustotal.sh out out/*.exe
          # Replace any earlier VirusTotal line or section (always last) with the new one.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed -E '/^(### VirusTotal|VirusTotal scan:)/,$d' > notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' notes.md
          cat out/virustotal.md >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          .github/scripts/publish-badge.sh out/virustotal.json
