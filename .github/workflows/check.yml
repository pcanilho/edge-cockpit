name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Layout and glyphs agree
        run: python scripts/check_layout.py
      - name: Scripts parse
        run: |
          python -m py_compile scripts/*.py
          for f in app/scripts/*.mjs app/test/*.mjs app/ui/*.js app/ui/lib/*.js; do node --check "$f"; done
      - name: Game.log reader, role pages and ship lookup
        working-directory: app
        run: npm test
      - name: Every page renders with full labels, nothing idles, and touches are fast
        working-directory: app
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:ui
