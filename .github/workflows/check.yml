name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Layout, Game.log reader and UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Layout and glyphs agree
        run: python scripts/check_layout.py
      - name: Scripts parse
        run: |
          python -m py_compile scripts/*.py
          for f in app/scripts/*.mjs app/test/*.mjs app/ui/*.js app/ui/lib/*.js; do node --check "$f"; done
      - run: npm ci
        working-directory: app
      - name: Game.log reader, role pages and ship lookup
        working-directory: app
        run: npm test
      - name: Every page renders with full labels, nothing idles, and touches are fast
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
