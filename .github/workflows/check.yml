name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Layout and glyphs agree
        run: python scripts/check_layout.py
      - name: Scripts parse
        run: |
          python -m py_compile scripts/*.py
          for f in app/scripts/*.mjs app/test/*.mjs app/ui/*.js app/ui/lib/*.js; do node --check "$f"; done
      - run: npm ci
        working-directory: app
      - name: Site builds
        run: python site/build.py "$RUNNER_TEMP/site"
      - name: Game.log reader, role pages and ship lookup
        working-directory: app
        run: npm test
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests on Linux, with the Game.log replay through the line filter
        working-directory: app/src-tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          cargo test --locked
      - name: Every page renders with full labels, nothing idles, and touches are fast
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
