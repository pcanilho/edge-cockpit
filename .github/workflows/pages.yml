name: Site

# Builds the project site from site/ and deploys it to GitHub Pages. Runs daily too,
# so the download links catch up with a new release without a push.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fonts
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json || echo '{}' > release.json
      # The live demo runs the released console, not main, so it never shows what isn't out yet.
      - name: Demo from the release
        run: |
          tag=$(jq -r '.tag_name // empty' release.json)
          ref=HEAD
          if [ -n "$tag" ] && git fetch --quiet --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"; then ref="refs/tags/$tag"; fi
          mkdir -p "$RUNNER_TEMP/demo"
          git archive "$ref" app/ui app/scripts layouts binds | tar -x -C "$RUNNER_TEMP/demo"
          ln -s "$PWD/app/node_modules" "$RUNNER_TEMP/demo/app/node_modules"
          node "$RUNNER_TEMP/demo/app/scripts/sync.mjs"
          echo "Demo from $ref"
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 site/build.py _site --release release.json --base-url "$BASE_URL" --demo "$RUNNER_TEMP/demo/app/ui"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write     # publish the site
      id-token: write  # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
