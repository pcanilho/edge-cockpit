version: 2
updates:
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ['tauri*']
      rust:
        patterns: ['*']
        exclude-patterns: ['tauri*']
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
